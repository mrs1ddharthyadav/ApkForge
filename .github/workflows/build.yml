name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ApkForge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ApkForge-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish download link
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK Forge build ${{ github.run_number }}
          body: Automatic build of ${{ github.sha }}. Download ApkForge.apk below and open it on your phone to install.
          files: ApkForge.apk
          make_latest: true
